<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-type" content="text/html; charset=utf-8">
  <title>twXray: See What You're Saying</title>
  <script type="text/javascript" charset="utf-8">
    document.createElement("section");
    document.createElement("article");
    document.createElement("figure");
  	document.createElement("header");
  	document.createElement("nav");
  	document.createElement("footer");
  </script>
  <script type="application/javascript" src="http://twxray.knilab.com/static/js/jquery-1.7.2.min.js"></script>
  <style type="text/css" media="screen">
  /* HTML5 Reset */
    /* http://meyerweb.com/eric/tools/css/reset/ 
       v2.0b1 | 201101 
       NOTE: WORK IN PROGRESS
       USE WITH CAUTION AND TEST WITH ABANDON */

    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, figcaption, figure, 
    footer, header, hgroup, menu, nav, section, summary,
    time, mark, audio, video {
    	margin: 0;
    	padding: 0;
    	border: 0;
    	outline: 0;
    	font-size: 100%;
    	font: inherit;
    	vertical-align: baseline;
    }
    /* HTML5 display-role reset for older browsers */
    article, aside, details, figcaption, figure, 
    footer, header, hgroup, menu, nav, section {
    	display: block;
    }
    body {
    	line-height: 1;
    }
    ol, ul {
    	list-style: none;
    }
    blockquote, q {
    	quotes: none;
    }
    blockquote:before, blockquote:after,
    q:before, q:after {
    	content: '';
    	content: none;
    }

    /* remember to define visible focus styles! 
    :focus {
    	outline: ?????;
    } */

    /* remember to highlight inserts somehow! */
    ins {
    	text-decoration: none;
    }
    del {
    	text-decoration: line-through;
    }

    table {
    	border-collapse: collapse;
    	border-spacing: 0;
    }
  /* twXray styles */
    body{
      background: #b6c647; /* Old browsers */
      background: -moz-linear-gradient(left, #b6c647 0%, #c9da4f 50%, #b6c647 100%); /* FF3.6+ */
      background: -webkit-gradient(linear, left top, right top, color-stop(0%,#b6c647), color-stop(50%,#c9da4f), color-stop(100%,#b6c647)); /* Chrome,Safari4+ */
      background: -webkit-linear-gradient(left, #b6c647 0%,#c9da4f 50%,#b6c647 100%); /* Chrome10+,Safari5.1+ */
      background: -o-linear-gradient(left, #b6c647 0%,#c9da4f 50%,#b6c647 100%); /* Opera 11.10+ */
      background: -ms-linear-gradient(left, #b6c647 0%,#c9da4f 50%,#b6c647 100%); /* IE10+ */
      background: linear-gradient(left, #b6c647 0%,#c9da4f 50%,#b6c647 100%); /* W3C */
      filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#b6c647', endColorstr='#b6c647',GradientType=1 ); /* IE6-9 */
      font-family:Helvetica,HelveticaNeue,Verdana,Arial,Sans-Serif;
      color:#ffffff;
      }
    textarea:focus, input:focus{outline: none;}
    a{text-decoration:none;}
    a:hover{color:#fff;}
    section#container,footer{width:1024px;margin:0 auto;}
    #search header h1{text-indent:-9999px;background-image:url('img/twXray-logo.png');width:445px;height:180px;margin:85px auto 120px auto;}
    #search #content #twittername {overflow:auto; width:520px;margin:0 auto; position: relative; right:20px;}
    #search #content input#go {color:#676766;-webkit-border-radius:25px; -moz-border-radius: 25px; border-radius: 25px; border:none; width: 37px; height: 37px; font-size:12pt; float:right; position: relative; top:54px; right:20px;}
    /* #search #content input#goinput[type=button]:active{background:#5eb7ae;color:#ffffff;} */
    #search #content input#username {color:#fff;-webkit-border-radius:65px; -moz-border-radius: 65px; border-radius: 65px; margin:0 auto; width:520px; height: 66px; background: #67c9bf; font-size: 18pt; text-align: center; display: block; border: none; -moz-box-shadow: inset 0 0 15px #5eb7ae; -webkit-box-shadow: inset 0 0 15px #5eb7ae; box-shadow: inset 0 0 15px #5eb7ae; text-shadow: 0 1px 1px #000;}
    #search #content p{margin:15px auto 0 auto;width:1024px;text-align:center;font-size:8pt;margin-top:15px;position: relative; right:20px;}
    footer {text-align:center;position:absolute;bottom:25px;font-size:12pt;}
    footer a{color:#676766;}
    }
  </style>
</head>
<body id="search">
  <section id="container">
    <header>
      <h1>twXray</h1>
    </header>
    <div id="content">
      <div id="twittername">
        <input id="go" type="button" value="Go" onclick="submit_username();" />
        <input type="text" name="twXray" height="65" placeholder="Enter your Twitter user name" id="username" onkeydown="if (event.keyCode == 13) { submit_username(); }" />
      </div>
      <p><a href="http://knightlab.northwestern.edu">How does this twXray work?</a></p>
    </div>
    <footer><a href="http://knightlab.northwestern.edu">Brought to you by the Knight News Innovation Lab at Northwestern University</a></footer>
  </section>

  <script type="text/javascript">
      function submit_username() {
          var username = $.trim($('#username').val());
          if (username) {
              window.location += "profile/"+username;
          }
      }
  </script>
</body>
</html>
